apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: databases
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./databases/production
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      # https://hub.docker.com/r/bitnamicharts/postgresql/tags
      postgresql_version: "^18"
      # https://hub.docker.com/r/bitnamicharts/redis/tags
      redis_version: "^27"
