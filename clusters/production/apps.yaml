apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring
  # short delay for deanqx-com
  interval: 2m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud-db
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production/nextcloud/database
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      # https://hub.docker.com/r/bitnamicharts/postgresql/tags
      postgresql_version: "^18"
      # https://hub.docker.com/r/bitnamicharts/redis/tags
      redis_version: "^27"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud-app
  namespace: flux-system
spec:
  dependsOn:
    - name: nextcloud-db
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production/nextcloud/app
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      # https://github.com/nextcloud/helm/releases
      nextcloud_version: "^9"
